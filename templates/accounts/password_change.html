{% extends "base.html" %}
{% block title %}পাসওয়ার্ড পরিবর্তন{% endblock %}
{% block content %}
<div class="card shadow-sm" style="max-width:520px;margin:auto;">
    <div class="card-body">
        <h4 class="mb-4">পাসওয়ার্ড পরিবর্তন করুন</h4>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-brand">পরিবর্তন করুন</button>
        </form>
    </div>
</div>
{% endblock %}
