{% extends "base.html" %}
{% block title %}বিষয় ব্যবস্থাপনা{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4>বিষয় তালিকা</h4>
    <a href="{% url 'subject_add' %}" class="btn btn-brand btn-sm">+ নতুন বিষয়</a>
</div>
<div class="card shadow-sm">
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead class="table-light"><tr><th>নাম</th><th>শ্রেণি</th><th>কোড</th><th></th></tr></thead>
            <tbody>
            {% for s in subjects %}
                <tr>
                    <td>{{ s.name }}</td>
                    <td>{{ s.school_class }}</td>
                    <td>{{ s.code|default:"-" }}</td>
                    <td>
                        <a href="{% url 'subject_edit' s.pk %}" class="btn btn-sm btn-outline-secondary">সম্পাদনা</a>
                        <a href="{% url 'subject_delete' s.pk %}" class="btn btn-sm btn-outline-danger">মুছুন</a>
                    </td>
                </tr>
            {% empty %}
                <tr><td colspan="4" class="text-center text-muted py-4">কোনো বিষয় নেই।</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
